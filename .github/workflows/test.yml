name: Sofia Node checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check public/advanced-catalog.js
      - name: Start server and check health and homepage
        shell: bash
        run: |
          node server.mjs > sofia-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:3100/api/health | grep -q '"ok":true'
          curl --fail --silent http://127.0.0.1:3100/ | grep -q 'Sofia Personal Trainer Studio'
          curl --fail --silent http://127.0.0.1:3100/app.js | grep -q 'buildOriginalConcepts'

