name: Sofia Node checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check public/advanced-catalog.js
