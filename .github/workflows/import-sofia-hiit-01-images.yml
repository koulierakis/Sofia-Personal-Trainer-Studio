name: Import generated Sofia frames
on:
  push:
    branches:
      - feat/sofia-hiit-01-image-upload
    paths:
      - public/data/hiit-frame-import-manifest.json
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch generated images and link exact frame files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const m = JSON.parse(await fs.readFile('public/data/hiit-frame-import-manifest.json','utf8'));
          const catalogPath = 'public/data/hiit-50-pending.json';
          const catalog = JSON.parse(await fs.readFile(catalogPath,'utf8'));
          const entry = catalog.find(x => x.id === m.exerciseId);
          if (!entry || entry.visualization.frames.length !== m.totalFrames) throw new Error('Mismatch in exercise/frames');
          const imagePaths = new Map();
          for (const item of m.uniqueFrames) {
            const frame = entry.visualization.frames.find(f => f.frame === item.frame);
            if (!frame || frame.sameImageAs !== null) throw new Error('Invalid unique frame: '+item.frame);
            const response = await fetch(item.url,{redirect:'follow'});
            if (!response.ok) throw new Error('Image download failed: '+item.frame+' HTTP '+response.status);
            const bytes = Buffer.from(await response.arrayBuffer());
            if(bytes.length < 12000 || bytes[0] !== 0x89 || bytes[1] !== 0x50 || bytes[2] !== 0x4e || bytes[3] !== 0x47) throw new Error('Not a PNG: '+item.frame);
            const p = 'public/images/exercises/'+m.exerciseId+'/frame-'+String(item.frame).padStart(2,'0')+'.png';
            await fs.mkdir(path.dirname(p),{recursive:true});
            await fs.writeFile(p,bytes);
            imagePaths.set(item.frame,'/'+p.slice('public/'.length));
            console.log('Imported',p,bytes.length);
          }
          for (const frame of entry.visualization.frames) {
            const source = frame.sameImageAs ?? frame.frame;
            if(!imagePaths.has(source)) throw new Error('Missing source frame '+source);
            frame.imageUrl = imagePaths.get(source);
          }
          entry.imageStatus = 'generated_pending_approval';
          entry.reviewStatus = 'pending';
          entry.approvalState = 'pending_approval';
          entry.verified = false;
          entry.approvedBySofia = false;
          await fs.writeFile(catalogPath,JSON.stringify(catalog,null,2)+'\n');
          JS
      - name: Commit imported PNG frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/exercises/ public/data/hiit-50-pending.json
          git diff --cached --quiet || (git commit -m "Import actual generated first HIIT exercise frames with exact REUSE aliases" && git push)
